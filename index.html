<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadhouse Servers</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <!-- Installable app: manifest, icons, iPhone home-screen settings and the service worker -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Roadhouse">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/site.css">
    <style>
        /* Each page the account can open, as a card (like the client portal's page list) */
        .page-links { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .page-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }
        .page-link-icon { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--raised); color: var(--gold); display: flex; align-items: center; justify-content: center; }
        .page-link-icon svg { width: 22px; height: 22px; }
        .page-link-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .page-link-title { font-family: 'Oswald', sans-serif; font-size: 1.4rem; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px; }
        .page-link-sub { font-size: 0.9rem; color: var(--muted); }
        .page-link-arrow { flex: 0 0 auto; color: var(--red); display: flex; }
        .page-link-arrow svg { width: 20px; height: 20px; transition: transform 0.25s ease; }
        @media (hover: hover) {
            .page-link:hover { border-color: var(--gold); transform: translateY(-2px); }
            .page-link:hover .page-link-arrow svg { transform: translateX(3px); }
        }
        .home-message { color: var(--muted); }
    </style>
</head>
<body class="is-checking">
    <div class="page-loader" role="status">
        <span class="loader-badge" aria-hidden="true"><svg class="loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></span>
        <span class="sr-only">Loading</span>
        <span class="page-loader-text" aria-hidden="true">Popping the popcorn...</span>
        <span class="loader-bar" aria-hidden="true"></span>
    </div>
    <script src="/loader.js"></script>

    <header>
        <div class="top-bar">
            <img src="/icons/logo-white.png" alt="RoadHouse Cinemas" width="1077" height="439">
            <button type="button" class="sign-out" id="sign-out">
                Sign Out
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="main-card">
            <div class="card-head">
                <div>
                    <span class="card-eyebrow">Roadhouse Servers</span>
                    <h2 id="greeting">Welcome</h2>
                </div>
            </div>
            <ul class="page-links" id="page-links">
                <li><a class="page-link" href="/server">
                    <span class="page-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></span>
                    <span class="page-link-text"><span class="page-link-title">Server Dashboard</span><span class="page-link-sub">Your theaters, show times and what’s next</span></span>
                    <span class="page-link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
                </a></li>
                <!-- (Server leads only) -->
                <li id="lead-link" hidden><a class="page-link" href="/lead">
                    <span class="page-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span>
                    <span class="page-link-text"><span class="page-link-title">Lead Dashboard</span><span class="page-link-sub">Today’s show times and who has which rows</span></span>
                    <span class="page-link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
                </a></li>
                <!-- (Roadhouse admins only) -->
                <li id="admin-link" hidden><a class="page-link" href="/admin">
                    <span class="page-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <span class="page-link-text"><span class="page-link-title">Admin</span><span class="page-link-sub">Roadhouse users and their roles</span></span>
                    <span class="page-link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
                </a></li>
            </ul>
        </section>
    </main>

    <script type="module">
        import { firebaseConfig, isConfigured, API_URL, FIREBASE_SDK } from '/firebase-config.js';

        // A show day runs from 6 AM to 6 AM Arizona time (MST all year); everyone is signed out when a new one starts
        const showDay = (ms = Date.now()) => new Date(ms - 7 * 3600e3 - 6 * 3600e3).toISOString().slice(0, 10);

        if (!isConfigured) {
            location.replace('/login');
        } else {
            const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
            const { getAuth, onAuthStateChanged, signOut } = await import(`${FIREBASE_SDK}/firebase-auth.js`);
            const auth = getAuth(initializeApp(firebaseConfig));

            onAuthStateChanged(auth, async user => {
                if (!user) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
                // Signed in before today's 6 AM: signed out (which comes back here with no user)
                if (showDay(Date.parse(user.metadata.lastSignInTime)) !== showDay()) { signOut(auth); return; }
                try {
                    const json = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ idToken: await user.getIdToken() }),
                    }).then(r => r.json());
                    // Signed in but no account yet: finish signing up (the name) on the sign-in page
                    if (!json.ok && json.error === 'not_found') { location.replace('/login'); return; }
                    const row = (json && json.row) || {};
                    const name = String(row['PREFERRED NAME'] || row['FIRST NAME'] || '').trim();
                    if (name) document.getElementById('greeting').textContent = 'Hi, ' + name;
                    const has = role => String(row[role]).toUpperCase() === 'TRUE';
                    document.getElementById('lead-link').hidden = !has('SERVER LEAD');
                    document.getElementById('admin-link').hidden = !has('ROADHOUSE ADMIN');
                } catch (err) {
                    console.error(err); // (the greeting just stays "Welcome")
                }
                document.body.classList.remove('is-checking');
            });

            const signOutBtn = document.getElementById('sign-out');
            signOutBtn.addEventListener('click', async () => {
                signOutBtn.disabled = true;
                await signOut(auth);
            });
        }
    </script>
</body>
</html>
