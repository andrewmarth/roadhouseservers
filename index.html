<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Times | Roadhouse Servers</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <!-- Installable app: manifest, icons, iPhone home-screen settings and the service worker -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Roadhouse">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- Roadhouse palette: near-black with light gray text, red for actions, gold for headings --- */
        :root {
            --bg: #0c0d0e;
            --panel: #131516;
            --raised: #1c1e20;
            --line: #252224;
            --line-strong: #3a3d40;
            --text: #f2f3f4;
            --muted: #a7afb2;
            --red: #ed2227;
            --red-bright: #f02729;
            --gold: #c79048;
            --gold-dark: #a67433;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background-color: var(--bg); }
        body {
            font-family: 'Roboto Slab', serif;
            line-height: 1.55;
            color: var(--text);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hidden until we know who is signed in and the data has loaded (only the loading screen shows) */
        body.is-checking > *:not(.page-loader) { visibility: hidden; }
        /* No scrolling (or pull-to-refresh bounce) while the loading screen is up */
        html:has(body.is-checking), body.is-checking { overflow: hidden; overscroll-behavior: none; }
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        body:not(.is-checking) .page-loader { opacity: 0; visibility: hidden; pointer-events: none; }
        /* Morphing icon (loader.js): pops with a twist each time it changes */
        .loader-badge { width: 120px; height: 120px; margin-bottom: 14px; color: var(--gold); display: flex; align-items: center; justify-content: center; }
        .loader-icon { width: 92px; height: 92px; overflow: visible; }
        .loader-badge.is-morphing .loader-icon { animation: iconMorph 0.65s cubic-bezier(0.34, 1.4, 0.64, 1); }
        @keyframes iconMorph {
            0% { transform: rotate(0deg) scale(1); }
            40% { transform: rotate(-12deg) scale(0.84); }
            75% { transform: rotate(4deg) scale(1.08); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .page-loader-text { font-family: 'Oswald', sans-serif; font-size: 1.25rem; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; transition: opacity 0.22s ease, transform 0.22s ease; }
        .page-loader-text.is-leaving { opacity: 0; transform: translateY(-8px); }
        .page-loader-text.is-entering { animation: phraseIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1); }
        @keyframes phraseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.9; transform: none; } }
        /* Loading bar: a red segment that sweeps across the track, over and over */
        .loader-bar { position: relative; width: 180px; height: 4px; margin-top: 16px; border-radius: 999px; background: var(--line); overflow: hidden; }
        .loader-bar::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 40%;
            border-radius: 999px;
            background: var(--red);
            animation: loaderBar 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes loaderBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) {
            .loader-bar::before { animation-duration: 3s; }
            .loader-badge.is-morphing .loader-icon, .page-loader-text.is-entering { animation: none; }
        }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        h1, h2, h3 { font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

        /* --- Header: the logo on black, like the theater's own site --- */
        header { background: #000; border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top, 0px) 20px 0 20px; }
        .top-bar { max-width: 760px; min-height: 76px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .top-bar img { height: 46px; width: auto; display: block; }
        .sign-out {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 8px 16px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .sign-out svg { width: 16px; height: 16px; }
        @media (hover: hover) { .sign-out:hover { background: var(--red); border-color: var(--red); } }

        /* --- Main card --- */
        main {
            flex: 1;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .main-card { padding: 0; }
        .card-eyebrow { display: block; font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
        .main-card h2 { font-size: 2.4rem; line-height: 1.05; margin-bottom: 6px; }
        .card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
        .now-line { margin-bottom: 18px; font-size: 0.92rem; color: var(--muted); }
        .now-line:empty { display: none; }
        .head-edit {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            margin-bottom: 6px;
            padding: 0 18px 0 15px;
            border: none;
            border-radius: 999px;
            background: var(--red);
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.25s ease;
        }
        .head-edit[hidden] { display: none; }
        .head-edit svg { width: 15px; height: 15px; }
        @media (hover: hover) { .head-edit:hover { background: var(--red-bright); transform: translateY(-2px); } }
        .shows-message { text-align: center; padding: 10px 0; color: var(--muted); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 10px 26px;
            border: 1px solid var(--red);
            border-radius: 999px;
            background-color: var(--red);
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.25s ease;
        }
        .btn svg { width: 18px; height: 18px; }
        @media (hover: hover) { .btn:hover { background-color: var(--red-bright); transform: translateY(-2px); } }
        .btn:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .btn-secondary { background: transparent; border-color: var(--line-strong); color: var(--text); }
        @media (hover: hover) { .btn-secondary:hover { background: var(--raised); } }
        .btn .btn-spinner { display: none; width: 16px; height: 16px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; animation: spin 0.8s linear infinite; }
        .btn.is-loading .btn-spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* No show times yet */
        .shows-empty { padding: 30px 20px 28px; border-radius: 14px; background: var(--panel); border: 1px dashed var(--line-strong); text-align: center; }
        .shows-empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px; margin-bottom: 10px; border-radius: 50%; background: var(--raised); color: var(--gold); }
        .shows-empty-icon svg { width: 27px; height: 27px; }
        .shows-empty-title { font-family: 'Oswald', sans-serif; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .shows-empty-text { max-width: 380px; margin: 4px auto 18px; color: var(--muted); }

        /* --- Each step in its own box: gray (not yet), green (now), yellow (late), red (very late), gray again once done --- */
        .steps { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .step {
            --bg: var(--panel); --line: var(--line-strong); --ink: var(--text); --strong: var(--muted);
            display: flex;
            gap: 14px;
            padding: 16px 18px 16px 16px;
            border: 1px solid var(--line);
            border-left-width: 6px;
            border-radius: 12px;
            background: var(--bg);
            color: var(--ink);
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }
        .step.is-green { --bg: #10261a; --line: #34a35a; --strong: #4cc475; }
        .step.is-yellow { --bg: #2b2310; --line: #e0ac1f; --strong: #f2c443; }
        .step.is-red { --bg: #2e1112; --line: var(--red); --strong: #ff5a5d; }
        .step.is-done { --ink: var(--muted); }
        .step-icon { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); color: var(--strong); }
        .step-icon svg { width: 21px; height: 21px; }
        .step-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .step-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .step-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
        /* Complete: marks a step that isn't due yet done early */
        .step-early { min-height: 30px; padding: 2px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--text); font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: border-color 0.2s ease, background-color 0.2s ease; }
        @media (hover: hover) { .step-early:hover { border-color: var(--gold); background: var(--raised); } }
        .step-name { font-family: 'Oswald', sans-serif; font-size: 1.35rem; font-weight: 500; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px; }
        .step-time { flex: 0 0 auto; font-family: 'Oswald', sans-serif; font-size: 1.35rem; font-weight: 500; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--gold); }
        .step.is-done .step-time { color: var(--muted); }
        .step-where { margin-top: 3px; font-weight: 700; overflow-wrap: anywhere; }
        .step-show { font-size: 0.85rem; color: var(--muted); }
        .step-wait { margin-top: 8px; font-weight: 700; color: var(--muted); }
        .step-warn { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 12px; border-radius: 999px; background: var(--gold); color: #111; font-size: 0.85rem; font-weight: 700; }
        .step-warn svg { width: 15px; height: 15px; }
        .step-btn {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            background: var(--strong);
            color: #0c0d0e;
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .step-btn svg { flex: 0 0 auto; width: 18px; height: 18px; }
        @media (hover: hover) { .step-btn:hover { transform: translateY(-2px); filter: brightness(1.1); } }
        .step-done-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; }
        .step-done { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--muted); }
        .step-done svg { width: 16px; height: 16px; color: #4cc475; }
        /* Undo: moves a completed step back to the list (and the Show Times menu's Edit) */
        .step-undo, .rh-edit {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 6px 16px 6px 13px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .step-undo svg, .rh-edit svg { width: 15px; height: 15px; }
        @media (hover: hover) { .step-undo:hover, .rh-edit:hover { border-color: var(--gold); background: var(--raised); } }
        .steps-clear { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 12px; background: var(--panel); font-weight: 700; color: var(--muted); }
        .steps-clear svg { width: 18px; height: 18px; color: #4cc475; }
        .completed { margin-top: 30px; }
        .completed-title { padding: 0 2px 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 1.2rem; color: var(--gold); }

        /* --- Show Times menu (the pop-up look from sheet.js) --- */
        .rh-dialog .rh-entries { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
        .rh-entry { display: grid; gap: 16px; min-width: 0; margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
        .rh-entry-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
        .rh-dialog .ie-remove[hidden] { display: none; }
        .rh-dialog .rh-label { display: block; font-size: 0.9rem; font-weight: bold; margin: 0 0 8px 4px; }
        .rh-dialog .field input.rh-aud { max-width: 150px; }
        .rh-dialog .rh-error { margin: 6px 0 0 6px; font-size: 0.85rem; font-weight: bold; color: #ff5a5d; }
        .rh-dialog .rh-error:empty { display: none; }
        .rh-time { display: flex; align-items: center; gap: 8px; }
        .rh-dialog .field .rh-time select { flex: 1 1 0; min-width: 0; min-height: 50px; padding: 10px 34px 10px 14px; background-position: right 10px center; }
        .rh-colon { flex: 0 0 auto; font-weight: bold; font-size: 1.2rem; }
        .rh-ampm { flex: 0 0 auto; display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--raised); }
        .rh-ampm button { min-width: 46px; min-height: 42px; padding: 0 10px; border: none; border-radius: 999px; background: none; color: var(--muted); font-family: 'Oswald', sans-serif; font-size: 1rem; cursor: pointer; transition: background-color 0.2s ease, color 0.2s ease; }
        .rh-ampm button[aria-pressed="true"] { background: var(--red); color: #fff; }
        .rh-hint { margin: -4px 0 8px 4px; font-size: 0.85rem; color: var(--muted); }
        .rh-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; border-radius: 12px; }
        .rh-rows.is-invalid { outline: 2px solid var(--red); outline-offset: 4px; }
        .rh-rows-empty { grid-column: 1 / -1; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line-strong); font-size: 0.9rem; color: var(--muted); }
        .rh-row { position: relative; }
        .rh-row input { position: absolute; opacity: 0; pointer-events: none; }
        .rh-row span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-height: 52px;
            border: 1px solid var(--line-strong);
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .rh-row span svg { display: none; width: 15px; height: 15px; }
        .rh-row input:checked + span { background: var(--red); border-color: var(--red); color: #fff; }
        .rh-row input:checked + span svg { display: block; }
        .rh-row input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
        @media (hover: hover) { .rh-row span:hover { transform: translateY(-2px); } }
        .rh-dialog .ie-add-entry { width: 100%; margin-top: 14px; }
        /* Each showing (and last call) is saved on its own, then shown locked with an Edit button */
        .rh-head-actions { display: flex; align-items: center; gap: 6px; }
        .rh-dialog .rh-edit { min-height: 34px; padding: 4px 14px 4px 11px; font-size: 0.85rem; }
        .rh-sum { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; }
        .rh-sum-main { font-family: 'Oswald', sans-serif; font-size: 1.4rem; line-height: 1.25; text-transform: uppercase; }
        .rh-sum-sub { color: var(--muted); }
        .rh-sum-tag { align-self: flex-start; margin-top: 6px; padding: 3px 12px; border-radius: 999px; background: var(--gold); color: #111; font-size: 0.82rem; font-weight: bold; }
        .rh-check { display: flex; align-items: center; gap: 10px; margin-top: -4px; font-weight: bold; cursor: pointer; }
        .rh-check input { flex: 0 0 auto; width: 22px; height: 22px; accent-color: var(--red); }
        .rh-entry-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
        .rh-entry-actions .btn { min-height: 44px; padding: 8px 20px; }
        .rh-confirm { font-weight: bold; }

        /* "Has everyone been greeted?" (centered card on desktop, slides up from the bottom on phones) */
        .confirm-dialog {
            margin: auto;
            width: calc(100% - 40px);
            max-width: 440px;
            padding: 26px 26px 22px 26px;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            background: var(--panel);
            color: var(--text);
        }
        .confirm-dialog::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        .confirm-dialog[open] { animation: dialogIn 0.4s var(--ease); }
        .confirm-dialog[open]::backdrop { animation: fadeIn 0.3s ease; }
        @keyframes dialogIn { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .confirm-dialog h2 { font-size: 1.8rem; line-height: 1.1; margin-bottom: 8px; }
        .confirm-dialog p { color: var(--muted); font-size: 0.95rem; margin-bottom: 22px; }
        .confirm-dialog .confirm-message { margin: -10px 0 14px; font-weight: bold; color: #ff5a5d; }
        .confirm-dialog .confirm-message:empty { display: none; }
        .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }

        /* --- Scroll Reveal --- */
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
        .reveal.is-visible { opacity: 1; transform: none; }

        @media (max-width: 600px) {
            .top-bar { min-height: 64px; }
            .top-bar img { height: 38px; }
            .sign-out { padding: 8px 13px; font-size: 0.85rem; }
            main { padding-top: 22px; }
            .main-card h2 { font-size: 2rem; }
            .step { gap: 12px; padding: 14px 14px 14px 12px; }
            .step-icon { width: 36px; height: 36px; }
            .step-icon svg { width: 18px; height: 18px; }
            .step-name, .step-time { font-size: 1.2rem; }
            .step-btn { align-self: stretch; }
            .rh-entry { padding: 14px 12px; }
            .rh-entry-actions { flex-direction: column-reverse; }
            .rh-entry-actions .btn { width: 100%; }
            .confirm-dialog {
                width: 100%;
                max-width: none;
                margin: auto 0 0 0;
                padding: 24px 20px calc(env(safe-area-inset-bottom, 0px) + 20px) 20px;
                border-radius: 18px 18px 0 0;
                border-bottom: none;
            }
            .confirm-dialog[open] { animation: sheetIn 0.42s var(--ease); }
            @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
            .confirm-actions { flex-direction: column-reverse; }
            .confirm-actions .btn { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; transition: none; }
            .confirm-dialog[open], .confirm-dialog[open]::backdrop { animation: none; }
            .step { transition: none; }
        }
    </style>
</head>
<body class="is-checking">
    <div class="page-loader" role="status">
        <span class="loader-badge" aria-hidden="true"><svg class="loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></span>
        <span class="sr-only">Loading</span>
        <span class="page-loader-text" aria-hidden="true">Popping the popcorn...</span>
        <span class="loader-bar" aria-hidden="true"></span>
    </div>
    <script src="/loader.js"></script>

    <header>
        <div class="top-bar">
            <img src="/icons/logo-white.png" alt="RoadHouse Cinemas" width="1077" height="439">
            <button type="button" class="sign-out" id="sign-out">
                Sign Out
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
        </div>
    </header>

    <main>
        <!-- Today's showings: each one's Theater Open, Drop and Pick Up, in time order; done steps under Completed -->
        <section class="main-card reveal" id="shows-card">
            <div class="card-head">
                <div>
                    <span class="card-eyebrow">Today</span>
                    <h2>Show Times</h2>
                </div>
                <button type="button" class="head-edit" id="edit-shows" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    Edit
                </button>
            </div>
            <p class="now-line" id="now-line"></p>
            <div id="shows"></div>
        </section>
    </main>

    <!-- Before a step moves to Completed -->
    <dialog class="confirm-dialog" id="step-confirm" aria-labelledby="step-confirm-title" aria-describedby="step-confirm-text">
        <h2 id="step-confirm-title">Has everyone been greeted?</h2>
        <p id="step-confirm-text"></p>
        <p class="confirm-message" role="alert"></p>
        <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="step-cancel">Cancel</button>
            <button type="button" class="btn" id="step-ok"><span class="btn-spinner" aria-hidden="true"></span><span id="step-ok-text">Confirm</span></button>
        </div>
    </dialog>


    <script type="module">
        import { firebaseConfig, isConfigured, API_URL, FIREBASE_SDK } from '/firebase-config.js';
        import { ensureDialogStyles, lockPageScroll } from '/sheet.js';

        // --- Time: everything is Arizona time (MST all year, UTC-7). A day runs from 6 AM to 6 AM, so the show times
        // are erased at 6 AM (the API deletes an earlier day's list; an open page clears itself). ---
        const AZ_OFFSET = 7 * 3600e3;
        const DAY_START_HOUR = 6;
        const MIN = 60000;
        const showDay = (ms = Date.now()) => new Date(ms - AZ_OFFSET - DAY_START_HOUR * 3600e3).toISOString().slice(0, 10);
        // A time of day ("HH:MM", 24-hour) on a show day, as a moment: times before 6 AM are after midnight
        function moment(day, hhmm) {
            const [h, m] = String(hhmm).split(':').map(Number);
            return Date.parse(day + 'T00:00:00Z') + AZ_OFFSET + (h * 60 + m) * MIN + (h < DAY_START_HOUR ? 864e5 : 0);
        }
        const clock = ms => new Date(ms).toLocaleTimeString('en-US', { timeZone: 'America/Phoenix', hour: 'numeric', minute: '2-digit' });
        // "5 minutes", "1 hour", "2 hours 5 minutes" (at least a minute)
        function duration(ms) {
            const n = Math.max(1, Math.ceil(ms / MIN));
            const part = (v, word) => v + ' ' + word + (v === 1 ? '' : 's');
            return n < 60 ? part(n, 'minute') : part(Math.floor(n / 60), 'hour') + (n % 60 ? ' ' + part(n % 60, 'minute') : '');
        }
        const pad = n => String(n).padStart(2, '0');

        // The rows in each auditorium (there is no row I in 10)
        const ROWS = { 1: 'ABCDEF', 2: 'ABCDEFG', 3: 'ABCDEF', 4: 'ABCDE', 5: 'ABCDEF', 6: 'ABCDE', 7: 'ABCD', 8: 'ABCDEF', 9: 'ABCDEF', 10: 'ABCDEFGHJ', 11: 'ABCDE', 12: 'AB', 13: 'AB', 14: 'AB' };
        // Showings and restroom checks, together
        const MAX_ITEMS = 30;

        const icon = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
        const CHECK = icon('<path d="M20 6 9 17l-5-5"/>');
        const BELL = icon('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>');
        const EDIT = icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
        const PLUS = icon('<path d="M12 5v14"/><path d="M5 12h14"/>');
        const UNDO = icon('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>');
        const CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
        const FILM = icon('<path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>');
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Each showing's three steps, and a restroom check's one. at: the time shown; turns: when the box turns green,
        // yellow and red (NEVER: it doesn't). Before it turns green the box is gray and says how long until its time.
        // autoDone: when it's done on its own. note: a line under it while it isn't done.
        const NEVER = Infinity;
        // A showing that ends after last call drops at last call (green then, yellow 10 minutes later, red 20), and its
        // Theater Open says to tell the guests about it
        const pastLastCall = s => state.lastCallMs !== null && s.endMs > state.lastCallMs;
        const OPEN = { key: 'open', name: 'Theater Open', icon: icon('<path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.56v16.16a1 1 0 0 1-1.24.97L5 20V5.56a2 2 0 0 1 1.52-1.94l4-1A2 2 0 0 1 13 4.56Z"/>'),
            // green from 30 minutes before the start until the theater goes dark (15 minutes after), then done on its own
            at: s => s.startMs - 30 * MIN, turns: s => [s.startMs - 30 * MIN, NEVER, NEVER], autoDone: s => s.startMs + 15 * MIN,
            note: s => (pastLastCall(s) ? 'Tell guests about last call at ' + clock(state.lastCallMs) : ''),
            waiting: ms => 'Theater opens in ' + duration(ms), button: 'Everyone has been greeted', confirm: 'Has everyone been greeted?' };
        const DROP = { key: 'drop', name: 'Drop', icon: icon('<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>'),
            at: s => (pastLastCall(s) ? state.lastCallMs : s.endMs - 30 * MIN),
            turns: s => (pastLastCall(s) ? [0, 10, 20].map(n => state.lastCallMs + n * MIN) : [s.endMs - 40 * MIN, s.endMs - 30 * MIN, s.endMs - 20 * MIN]),
            waiting: ms => 'Drop in ' + duration(ms), button: 'Theater has been dropped', confirm: 'Has the theater been dropped?' };
        const PICKUP = { key: 'pickup', name: 'Pick Up', icon: icon('<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>'),
            at: s => s.endMs + 5 * MIN, turns: s => [s.endMs + 5 * MIN, s.endMs + 10 * MIN, s.endMs + 20 * MIN],
            waiting: ms => 'Pickup checks in ' + duration(ms), button: 'Checks have been picked up', confirm: 'Have the checks been picked up?' };
        // The last showing of the night's Pick Up (the same step): green from its time on, never yellow or red
        const RESET = { ...PICKUP, name: 'Reset Theater', icon: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
            turns: s => [s.endMs + 5 * MIN, NEVER, NEVER],
            waiting: ms => 'Reset theater in ' + duration(ms), button: 'Theater has been reset', confirm: 'Has the theater been reset?' };
        const RESTROOM = { key: 'check', name: 'Restroom Check', icon: icon('<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>'),
            at: s => s.atMs, turns: s => [0, 10, 20].map(n => s.atMs + n * MIN),
            waiting: ms => 'Restroom check in ' + duration(ms), button: 'Restrooms have been checked', confirm: 'Have the restrooms been checked?' };
        const stepsOf = s => (s.kind === 'restroom' ? [RESTROOM] : [OPEN, DROP, s.last ? RESET : PICKUP]);
        const STATE_TEXT = { gray: 'Coming up', green: 'Now', yellow: 'Running late', red: 'Late', done: 'Completed' };
        const whereOf = s => (s.kind === 'restroom' ? 'Restrooms' : 'Auditorium ' + s.auditorium + ' · ' + (s.rows.length === 1 ? 'Row ' : 'Rows ') + s.rows.join(', '));

        const showsEl = document.getElementById('shows');
        const nowEl = document.getElementById('now-line');
        const editBtn = document.getElementById('edit-shows');
        const signOutBtn = document.getElementById('sign-out');
        // Today's list: { day, lastCall ("HH:MM" or blank), lastCallMs (null: none), shows: [{ id, kind: 'show', auditorium,
        // start, end, rows, last, done: { open, drop, pickup }, startMs, endMs } or { id, kind: 'restroom', time,
        // done: { check }, atMs }] }
        let state = null;
        let currentUser = null;

        async function api(payload) {
            const idToken = await currentUser.getIdToken();
            return fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ idToken, ...payload }),
            }).then(r => r.json());
        }
        const ERRORS = {
            invalid_shows: 'You can add up to 30 showings and restroom checks.',
            invalid_auditorium: 'Please enter an auditorium from 1 to 14.',
            invalid_time: 'Please pick the time.',
            invalid_last_call: 'Please pick the whole last call time, or leave it blank.',
            end_before_start: 'The end time has to be after the start time.',
            invalid_rows: 'Please pick at least one row for each showing.',
            shows_cleared: 'Today’s show times were cleared at 6 AM. Refresh the page.',
            not_found: 'This showing was changed. Refresh the page.',
            not_allowed: 'This page isn’t available for your account.',
        };
        const errorText = json => ERRORS[json && json.error] || 'Something went wrong. Please try again.';

        function apply(json) {
            const day = json.day;
            state = { day, lastCall: json.lastCall || '', lastCallMs: json.lastCall ? moment(day, json.lastCall) : null,
                shows: (json.shows || []).map(s => (s.kind === 'restroom' ? { ...s, atMs: moment(day, s.time) }
                    : { ...s, startMs: moment(day, s.start), endMs: moment(day, s.end) })) };
        }

        // --- The card ---
        // done: when it was done (ms; 0: not yet); auto: done on its own (nothing to undo)
        function stepHtml({ s, step, at, done, auto }, now) {
            const [green, yellow, red] = step.turns(s);
            const color = done ? 'done' : now < green ? 'gray' : now < yellow ? 'green' : now < red ? 'yellow' : 'red';
            const data = ' data-show="' + escapeHtml(s.id) + '" data-step="' + step.key + '"';
            const label = escapeHtml(step.name + ', ' + whereOf(s));
            const note = !done && step.note ? step.note(s) : '';
            let more = note ? '<p class="step-warn">' + BELL + escapeHtml(note) + '</p>' : '';
            if (auto) more += '<div class="step-done-row"><p class="step-done">' + CHECK + 'Completed automatically at ' + clock(done) + '</p></div>';
            else if (done) {
                more += '<div class="step-done-row"><p class="step-done">' + CHECK + 'Done at ' + clock(done) + '</p>'
                    + '<button type="button" class="step-undo"' + data + ' aria-label="Undo ' + label + '">' + UNDO + 'Undo</button></div>';
            }
            else if (color === 'gray') more += '<p class="step-wait">' + step.waiting(at - now) + '</p>';
            else more += '<button type="button" class="step-btn"' + data + '>' + CHECK + step.button + '</button>';
            return '<li class="step is-' + color + '"><span class="step-icon">' + step.icon + '</span><div class="step-body">'
                + '<div class="step-top"><span class="step-title"><span class="step-name">' + step.name + '<span class="sr-only">, ' + STATE_TEXT[color] + '</span></span>'
                + (color === 'gray' ? '<button type="button" class="step-early"' + data + ' aria-label="Complete ' + label + ' early">Complete</button>' : '') + '</span>'
                + '<span class="step-time">' + clock(at) + '</span></div>'
                + '<span class="step-where">' + escapeHtml(whereOf(s)) + '</span>'
                + (s.kind === 'restroom' ? '' : '<span class="step-show">Movie ' + clock(s.startMs) + ' – ' + clock(s.endMs) + '</span>')
                + more + '</div></li>';
        }
        let lastHtml = '';
        function render() {
            if (!state) return;
            const now = Date.now();
            nowEl.textContent = 'It’s ' + clock(now) + '. Show times clear at 6 AM.';
            editBtn.hidden = !state.shows.length;
            let html;
            if (!state.shows.length) {
                html = '<div class="shows-empty"><span class="shows-empty-icon">' + FILM + '</span>'
                    + '<p class="shows-empty-title">No show times yet</p>'
                    + '<p class="shows-empty-text">Add the theaters you’re working and their show times. Each step shows up here, and turns green when it’s time.</p>'
                    + '<button type="button" class="btn" data-add>' + PLUS + 'Add Show Times</button></div>';
            } else {
                const items = [];
                state.shows.forEach(s => stepsOf(s).forEach((step, n) => {
                    const saved = s.done[step.key];
                    const auto = !saved && step.autoDone && now >= step.autoDone(s);
                    items.push({ s, step, n, at: step.at(s), done: saved ? Date.parse(saved) : auto ? step.autoDone(s) : 0, auto });
                }));
                const order = (a, b) => (a.at - b.at) || ((a.s.auditorium || 0) - (b.s.auditorium || 0)) || (a.n - b.n);
                const active = items.filter(i => !i.done).sort(order);
                const done = items.filter(i => i.done).sort(order);
                html = (active.length ? '<ul class="steps">' + active.map(i => stepHtml(i, now)).join('') + '</ul>'
                        : '<p class="steps-clear">' + CHECK + 'All done for today’s showings.</p>')
                    + (done.length ? '<div class="completed"><h3 class="completed-title">Completed</h3><ul class="steps">' + done.map(i => stepHtml(i, now)).join('') + '</ul></div>' : '');
            }
            // Only redrawn when something on it changed (it's checked every few seconds)
            if (html !== lastHtml) { showsEl.innerHTML = html; lastHtml = html; }
        }
        function showMessage(text) {
            state = null;
            editBtn.hidden = true;
            nowEl.textContent = '';
            showsEl.innerHTML = '<p class="shows-message">' + escapeHtml(text) + '</p>';
            lastHtml = '';
        }
        showsEl.addEventListener('click', e => {
            if (e.target.closest('[data-add]')) openMenu();
            const b = e.target.closest('.step-btn, .step-early');
            if (b) openConfirm(b.dataset.show, b.dataset.step, false);
            const u = e.target.closest('.step-undo');
            if (u) openConfirm(u.dataset.show, u.dataset.step, true);
        });
        editBtn.addEventListener('click', () => openMenu());

        // --- "Everyone has been greeted" / "Theater has been dropped" / "Checks have been picked up", and Undo on a
        // completed step (back to the list, colored by the time again): confirm first ---
        const confirmBox = document.getElementById('step-confirm');
        const confirmOk = document.getElementById('step-ok');
        const confirmMessage = confirmBox.querySelector('.confirm-message');
        let pending = null;
        function openConfirm(showId, key, undo) {
            const s = state && state.shows.find(x => x.id === showId);
            const step = s && stepsOf(s).find(x => x.key === key);
            if (!step) return;
            pending = { showId, key, undo };
            document.getElementById('step-confirm-title').textContent = undo ? 'Undo ' + step.name + '?' : step.confirm;
            document.getElementById('step-confirm-text').textContent = whereOf(s) + '. '
                + (undo ? step.name + ' moves back to the list and is no longer marked done.' : step.name + ' moves to Completed.');
            document.getElementById('step-ok-text').textContent = undo ? 'Undo' : 'Confirm';
            confirmMessage.textContent = '';
            confirmOk.disabled = false;
            confirmOk.classList.remove('is-loading');
            confirmBox.showModal();
        }
        document.getElementById('step-cancel').addEventListener('click', () => confirmBox.close());
        confirmOk.addEventListener('click', async () => {
            if (!pending) return;
            confirmOk.disabled = true;
            confirmOk.classList.add('is-loading');
            confirmMessage.textContent = '';
            try {
                const json = await api({ action: pending.undo ? 'undoRoadhouseStep' : 'completeRoadhouseStep', showId: pending.showId, step: pending.key });
                if (!json.ok) throw json;
                apply(json);
                confirmBox.close();
                render();
            } catch (err) {
                console.error(err);
                confirmMessage.textContent = errorText(err);
            } finally {
                confirmOk.disabled = false;
                confirmOk.classList.remove('is-loading');
            }
        });
        // (the close event comes a moment later, so it's skipped when the box has already been opened again)
        confirmBox.addEventListener('close', () => { if (!confirmBox.open) pending = null; });

        // --- The Show Times menu: last call at the top, then each showing (auditorium, start and end time, rows, and
        // whether it's the last of the night) and restroom check (a time). Each one is saved on its own (the whole saved
        // list goes to the API with that one change) and then shown locked behind its Edit button. ---
        let menu = null;
        function openMenu() {
            if (!state) return;
            if (!menu) menu = buildMenu();
            menu.open();
        }
        function buildMenu() {
            ensureDialogStyles();
            const dialog = document.createElement('dialog');
            dialog.className = 'sheet rh-dialog';
            dialog.setAttribute('aria-labelledby', 'rh-menu-title');
            dialog.innerHTML = '<form class="sheet-form" novalidate>'
                + '<div class="dialog-head"><h2 id="rh-menu-title">Show Times</h2><button type="button" class="close-btn" data-close aria-label="Close">' + CLOSE + '</button></div>'
                + '<p class="muted">Each theater you’re working today. They’re cleared at 6 AM.</p>'
                + '<div class="dialog-scroll"><div class="rh-entries" data-entries></div>'
                + '<button type="button" class="ie-add-entry" data-add-entry="show">' + PLUS + 'Add Another Showing</button>'
                + '<button type="button" class="ie-add-entry" data-add-entry="restroom">' + PLUS + 'Add Restroom Check</button></div>'
                + '<div class="dialog-foot"><p class="form-message" role="alert"></p>'
                + '<div class="form-actions"><button type="button" class="btn" data-close>Done</button></div></div>'
                + '</form>';
            document.body.append(dialog);
            const $ = sel => dialog.querySelector(sel);
            const scroller = $('.dialog-scroll');
            const list = $('[data-entries]');
            const message = $('.form-message');
            const addBtns = dialog.querySelectorAll('[data-add-entry]');
            // Last call, then each showing / restroom check: { id, kind ('lastCall', 'show' or 'restroom'), saved (the
            // saved values in the form's shape; null: not saved yet), draft (the form's values), editing, removing }
            let entries = [];
            let busy = false;

            const blankTime = () => ({ h: '', m: '', ap: 'PM' });
            const blankDraft = kind => (kind === 'show' ? { aud: '', start: blankTime(), end: blankTime(), rows: [], last: false } : { time: blankTime() });
            const copy = v => JSON.parse(JSON.stringify(v));
            const audOf = v => (/^\d{1,2}$/.test(String(v)) && ROWS[Number(v)] ? Number(v) : 0);
            // "HH:MM" (24-hour) from the picker, or null until hour, minute and AM/PM are all picked
            const timeOf = t => (t.h && t.m !== '' && t.ap ? pad((Number(t.h) % 12) + (t.ap === 'PM' ? 12 : 0)) + ':' + t.m : null);
            const pickerOf = hhmm => { const [h, m] = hhmm.split(':').map(Number); return { h: String((h % 12) || 12), m: pad(m), ap: h >= 12 ? 'PM' : 'AM' }; };
            const clockOf = t => clock(moment(showDay(), timeOf(t)));
            const formOf = s => (s.kind === 'restroom' ? { time: pickerOf(s.time) }
                : { aud: String(s.auditorium), start: pickerOf(s.start), end: pickerOf(s.end), rows: [...s.rows], last: s.last });
            const lastCallEntry = () => {
                const saved = { time: state.lastCall ? pickerOf(state.lastCall) : blankTime() };
                return { id: '', kind: 'lastCall', saved, draft: copy(saved), editing: false };
            };
            // What the API takes for one saved (or being saved) entry
            const apiOf = (e, d) => (e.kind === 'restroom' ? { id: e.id, kind: 'restroom', time: timeOf(d.time) }
                : { id: e.id, auditorium: audOf(d.aud), start: timeOf(d.start), end: timeOf(d.end), rows: d.rows, last: d.last });
            const changed = e => e.editing && JSON.stringify(e.draft) !== JSON.stringify(e.saved || blankDraft(e.kind));

            const timeHtml = (k, which, label, t) => {
                const id = 'rh-' + which + '-' + k;
                return '<div class="field"><span class="rh-label" id="' + id + '">' + label + '</span>'
                    + '<div class="rh-time" data-time="' + which + '" role="group" aria-labelledby="' + id + '">'
                    + '<select class="rh-h" aria-label="Hour"><option value="">Hour</option>'
                    + Array.from({ length: 12 }, (_, i) => String(i + 1)).map(h => '<option' + (h === t.h ? ' selected' : '') + '>' + h + '</option>').join('') + '</select>'
                    + '<span class="rh-colon" aria-hidden="true">:</span>'
                    + '<select class="rh-m" aria-label="Minute"><option value="">Min</option>'
                    + Array.from({ length: 60 }, (_, i) => pad(i)).map(m => '<option' + (m === t.m ? ' selected' : '') + '>' + m + '</option>').join('') + '</select>'
                    + '<span class="rh-ampm">' + ['AM', 'PM'].map(ap => '<button type="button" data-ap="' + ap + '" aria-pressed="' + (t.ap === ap) + '">' + ap + '</button>').join('') + '</span>'
                    + '</div></div>';
            };
            const rowsHtml = d => {
                const n = audOf(d.aud);
                if (!n) return '<p class="rh-rows-empty">Enter the auditorium to see its rows.</p>';
                return ROWS[n].split('').map(r => '<label class="rh-row"><input type="checkbox" value="' + r + '"' + (d.rows.includes(r) ? ' checked' : '') + '>'
                    + '<span>' + CHECK + r + '</span></label>').join('');
            };
            function entryHtml(e, k) {
                const title = e.kind === 'lastCall' ? 'When is last call?' : e.kind === 'restroom' ? 'Restroom Check'
                    : 'Showing ' + entries.slice(0, k + 1).filter(x => x.kind === 'show').length;
                const what = e.kind === 'restroom' ? 'restroom check' : 'showing';
                let head = '';
                if (!e.editing && !e.removing) {
                    head = '<span class="rh-head-actions"><button type="button" class="rh-edit" data-edit aria-label="Edit ' + escapeHtml(title) + '">' + EDIT + 'Edit</button>'
                        + (e.kind === 'lastCall' ? '' : '<button type="button" class="ie-remove" data-remove aria-label="Remove ' + escapeHtml(title) + '">' + CLOSE + 'Remove</button>') + '</span>';
                } else if (e.editing && !e.saved) head = '<button type="button" class="ie-remove" data-remove aria-label="Remove ' + escapeHtml(title) + '">' + CLOSE + 'Remove</button>';
                let body;
                if (e.removing) {
                    body = '<p class="rh-confirm">Remove this ' + what + '? Anything marked done for it is cleared too.</p>'
                        + '<p class="rh-error" data-entry-error role="alert"></p>'
                        + '<div class="rh-entry-actions"><button type="button" class="btn btn-secondary" data-keep>Keep It</button>'
                        + '<button type="button" class="btn" data-remove-yes><span class="btn-spinner" aria-hidden="true"></span>Remove</button></div>';
                } else if (!e.editing) {
                    const d = e.saved;
                    body = '<div class="rh-sum">' + (e.kind === 'lastCall' ? (timeOf(d.time) ? '<p class="rh-sum-main">' + clockOf(d.time) + '</p>' : '<p class="rh-sum-sub">Not set</p>')
                        : e.kind === 'restroom' ? '<p class="rh-sum-main">' + clockOf(d.time) + '</p>'
                        : '<p class="rh-sum-main">Auditorium ' + escapeHtml(d.aud) + '</p><p class="rh-sum-sub">' + clockOf(d.start) + ' – ' + clockOf(d.end)
                            + ' · ' + (d.rows.length === 1 ? 'Row ' : 'Rows ') + d.rows.join(', ') + '</p>' + (d.last ? '<p class="rh-sum-tag">Last showing of the night</p>' : '')) + '</div>';
                } else {
                    const d = e.draft;
                    if (e.kind === 'lastCall') {
                        body = timeHtml(k, 'time', 'Last Call', d.time)
                            + '<p class="rh-hint">Showings that end after it drop at last call. Leave it blank if there’s none.</p>';
                    } else if (e.kind === 'restroom') body = timeHtml(k, 'time', 'Time', d.time);
                    else {
                        body = '<div class="field"><label for="rh-aud-' + k + '">Auditorium</label>'
                            + '<input id="rh-aud-' + k + '" class="rh-aud" type="text" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="1–14" value="' + escapeHtml(d.aud) + '">'
                            + '<p class="rh-error rh-aud-error" role="alert"></p></div>'
                            + timeHtml(k, 'start', 'Start Time', d.start) + timeHtml(k, 'end', 'End Time', d.end)
                            + '<div><span class="rh-label" id="rh-rows-' + k + '">Rows</span><p class="rh-hint">Select all that apply.</p>'
                            + '<div class="rh-rows" role="group" aria-labelledby="rh-rows-' + k + '">' + rowsHtml(d) + '</div></div>'
                            + '<label class="rh-check"><input type="checkbox" class="rh-last"' + (d.last ? ' checked' : '') + '>This is the last showing of the night</label>';
                    }
                    body += '<p class="rh-error" data-entry-error role="alert"></p>'
                        + '<div class="rh-entry-actions">' + (e.saved ? '<button type="button" class="btn btn-secondary" data-cancel>Cancel</button>' : '')
                        + '<button type="button" class="btn" data-save><span class="btn-spinner" aria-hidden="true"></span>Save '
                        + (e.kind === 'lastCall' ? 'Last Call' : e.kind === 'restroom' ? 'Restroom Check' : 'Showing') + '</button></div>';
                }
                return '<fieldset class="rh-entry" data-k="' + k + '"><legend class="sr-only">' + escapeHtml(title) + '</legend>'
                    + '<div class="rh-entry-head"><span>' + escapeHtml(title) + '</span>' + head + '</div>' + body + '</fieldset>';
            }
            function draw() {
                list.innerHTML = entries.map(entryHtml).join('');
                addBtns.forEach(b => { b.hidden = entries.length - 1 >= MAX_ITEMS; });
            }
            const entryOf = el => { const box = el.closest('[data-k]'); return box ? { box, e: entries[Number(box.dataset.k)] } : {}; };
            const boxOf = e => list.querySelector('[data-k="' + entries.indexOf(e) + '"]');
            const clearInvalid = box => box.querySelectorAll('.is-invalid').forEach(x => x.classList.remove('is-invalid'));

            scroller.addEventListener('input', ev => {
                const { box, e } = entryOf(ev.target);
                if (!e || !ev.target.matches('.rh-aud')) return;
                clearInvalid(box);
                // Digits only; the rows follow the auditorium (rows it doesn't have are let go)
                ev.target.value = ev.target.value.replace(/\D/g, '').slice(0, 2);
                e.draft.aud = ev.target.value;
                const n = audOf(e.draft.aud);
                if (n) e.draft.rows = e.draft.rows.filter(r => ROWS[n].includes(r));
                box.querySelector('.rh-aud-error').textContent = e.draft.aud && !n ? 'Auditoriums are 1 to 14.' : '';
                box.querySelector('.rh-rows').innerHTML = rowsHtml(e.draft);
            });
            scroller.addEventListener('change', ev => {
                const { box, e } = entryOf(ev.target);
                if (!e) return;
                clearInvalid(box);
                const t = ev.target.closest('[data-time]');
                if (t && ev.target.matches('.rh-h')) e.draft[t.dataset.time].h = ev.target.value;
                if (t && ev.target.matches('.rh-m')) e.draft[t.dataset.time].m = ev.target.value;
                if (ev.target.matches('.rh-last')) e.draft.last = ev.target.checked;
                if (ev.target.matches('.rh-row input')) {
                    const all = ROWS[audOf(e.draft.aud)] || '';
                    e.draft.rows = [...box.querySelectorAll('.rh-row input:checked')].map(x => x.value).sort((a, b) => all.indexOf(a) - all.indexOf(b));
                }
            });
            scroller.addEventListener('click', ev => {
                const add = ev.target.closest('[data-add-entry]');
                if (add) {
                    if (entries.length - 1 >= MAX_ITEMS) return;
                    const kind = add.dataset.addEntry;
                    entries.push({ id: '', kind, saved: null, draft: blankDraft(kind), editing: true });
                    message.textContent = '';
                    draw();
                    const box = list.lastElementChild;
                    box.scrollIntoView({ block: 'start', behavior: 'smooth' });
                    box.querySelector('input, select').focus({ preventScroll: true });
                    return;
                }
                const { box, e } = entryOf(ev.target);
                if (!e || busy) return;
                const ap = ev.target.closest('[data-ap]');
                if (ap) {
                    const t = ap.closest('[data-time]');
                    e.draft[t.dataset.time].ap = ap.dataset.ap;
                    t.querySelectorAll('[data-ap]').forEach(b => b.setAttribute('aria-pressed', String(b === ap)));
                    clearInvalid(box);
                }
                if (ev.target.closest('[data-edit]')) {
                    Object.assign(e, { editing: true, draft: copy(e.saved) });
                    draw();
                    boxOf(e).querySelector('input, select').focus();
                }
                if (ev.target.closest('[data-cancel]')) {
                    Object.assign(e, { editing: false, draft: copy(e.saved) });
                    draw();
                }
                if (ev.target.closest('[data-remove]')) {
                    // (one that was never saved just goes; a saved one asks first)
                    if (e.saved) e.removing = true;
                    else entries.splice(entries.indexOf(e), 1);
                    message.textContent = '';
                    draw();
                }
                if (ev.target.closest('[data-keep]')) { e.removing = false; draw(); }
                if (ev.target.closest('[data-remove-yes]')) save(e, ev.target.closest('.btn'), true);
                if (ev.target.closest('[data-save]')) {
                    const p = problem(e, box);
                    if (p) {
                        box.querySelector('[data-entry-error]').textContent = p[1];
                        p[0].classList.add('is-invalid');
                        p[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
                        (p[0].matches('.rh-rows') ? p[0].querySelector('input') : p[0]).focus({ preventScroll: true });
                        return;
                    }
                    save(e, ev.target.closest('.btn'), false);
                }
            });

            // What's missing from one entry: [the element to point at, what to say], or null
            function problem(e, box) {
                box.querySelector('[data-entry-error]').textContent = '';
                clearInvalid(box);
                const d = e.draft;
                const timeProblem = (t, what) => {
                    if (timeOf(d[t])) return null;
                    const p = box.querySelector('[data-time="' + t + '"]');
                    return [p.querySelector(d[t].h ? '.rh-m' : '.rh-h'), 'Please pick the ' + what + '.'];
                };
                if (e.kind === 'lastCall') return d.time.h || d.time.m ? timeProblem('time', 'whole time, or clear the hour and minute for no last call') : null;
                if (e.kind === 'restroom') return timeProblem('time', 'time');
                if (!audOf(d.aud)) return [box.querySelector('.rh-aud'), 'Please enter an auditorium from 1 to 14.'];
                const t = timeProblem('start', 'start time') || timeProblem('end', 'end time');
                if (t) return t;
                const day = showDay();
                if (moment(day, timeOf(d.end)) <= moment(day, timeOf(d.start))) return [box.querySelector('[data-time="end"] .rh-h'), 'The end time has to be after the start time.'];
                if (!d.rows.length) return [box.querySelector('.rh-rows'), 'Please pick at least one row.'];
                return null;
            }
            // Saves one entry's change (or removes it): the saved list goes to the API with only that change
            async function save(target, btn, remove) {
                const sent = entries.filter(e => e.kind !== 'lastCall' && (e === target ? !remove : e.saved));
                const lastCall = entries.find(e => e.kind === 'lastCall');
                const payload = {
                    action: 'saveRoadhouseShows',
                    lastCall: timeOf((target === lastCall ? target.draft : lastCall.saved).time) || '',
                    shows: sent.map(e => apiOf(e, e === target ? e.draft : e.saved)),
                };
                const error = boxOf(target).querySelector('[data-entry-error]');
                busy = true;
                btn.disabled = true;
                btn.classList.add('is-loading');
                try {
                    const json = await api(payload);
                    if (!json.ok) throw json;
                    apply(json);
                    // The API sends the list back in the same order, with each new one's ID
                    sent.forEach((e, i) => { e.id = json.shows[i].id; e.saved = formOf(json.shows[i]); });
                    if (remove) entries.splice(entries.indexOf(target), 1);
                    else if (target === lastCall) target.saved = { time: json.lastCall ? pickerOf(json.lastCall) : blankTime() };
                    Object.assign(target, { editing: false, removing: false, draft: copy(target.saved || {}) });
                    message.textContent = '';
                    draw();
                    render();
                } catch (err) {
                    console.error(err);
                    if (error) error.textContent = errorText(err);
                    btn.disabled = false;
                    btn.classList.remove('is-loading');
                } finally {
                    busy = false;
                }
            }

            // Closing with a change that isn't saved: say so (and point at it) instead
            function close(ev) {
                const open = entries.find(changed);
                if (!open) { dialog.close(); return; }
                if (ev) ev.preventDefault();
                message.textContent = 'Save or cancel your changes first.';
                boxOf(open).scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
            dialog.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close()));
            dialog.addEventListener('cancel', ev => { if (entries.some(changed)) close(ev); });
            $('form').addEventListener('submit', ev => ev.preventDefault());

            return {
                open() {
                    const editing = state.shows.length > 0;
                    entries = [lastCallEntry()].concat(state.shows.map(s => ({ id: s.id, kind: s.kind, saved: formOf(s), draft: formOf(s), editing: false })));
                    if (!editing) entries.push({ id: '', kind: 'show', saved: null, draft: blankDraft('show'), editing: true });
                    $('#rh-menu-title').textContent = editing ? 'Edit Show Times' : 'Add Show Times';
                    message.textContent = '';
                    busy = false;
                    draw();
                    dialog.showModal();
                    lockPageScroll(dialog);
                    scroller.scrollTop = 0;
                    if (!editing) list.querySelector('.rh-aud').focus();
                },
            };
        }

        // --- Keeping it current: the boxes are checked every few seconds; at 6 AM the list clears. Coming back to the app
        // reloads today's list (it may have changed on another device). ---
        async function refresh() {
            try {
                const json = await api({ action: 'roadhouseShows' });
                if (json.ok) { apply(json); render(); }
            } catch (err) { console.error(err); }
        }
        function tick() {
            if (!state) return;
            if (showDay() !== state.day) {
                state = { day: showDay(), lastCall: '', lastCallMs: null, shows: [] };
                document.querySelectorAll('.rh-dialog[open], .confirm-dialog[open]').forEach(d => d.close());
                refresh();
            }
            render();
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state) { tick(); refresh(); }
        });

        async function load(user) {
            currentUser = user;
            if (!API_URL) { showMessage('Show times aren’t available yet.'); return; }
            try {
                const json = await api({ action: 'roadhouseShows' });
                if (json.ok) {
                    apply(json);
                    render();
                    setInterval(tick, 5000);
                } else if (json.error === 'not_found') location.replace('/login');
                else if (json.error === 'not_allowed') showMessage('This page isn’t available for your account.');
                else throw new Error(json.error || 'Request failed');
            } catch (err) {
                console.error(err);
                showMessage('We couldn’t load your show times. Please refresh to try again.');
            }
        }

        function initReveal() {
            const items = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) { items.forEach(el => el.classList.add('is-visible')); return; }
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
                });
            }, { threshold: 0, rootMargin: '0px 0px -40px 0px' });
            items.forEach(el => observer.observe(el));
        }

        if (!isConfigured) {
            location.replace('/login');
        } else {
            const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
            const { getAuth, onAuthStateChanged, signOut } = await import(`${FIREBASE_SDK}/firebase-auth.js`);
            const auth = getAuth(initializeApp(firebaseConfig));

            onAuthStateChanged(auth, user => {
                // Not signed in: send them to the login page (and back here afterwards)
                if (!user) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
                // Stay on the loading screen until the list is in, with a time limit
                const timeLimit = new Promise(resolve => setTimeout(resolve, 30000));
                Promise.race([load(user), timeLimit]).then(() => {
                    document.body.classList.remove('is-checking');
                    initReveal();
                });
            });

            signOutBtn.addEventListener('click', async () => {
                signOutBtn.disabled = true;
                await signOut(auth);
            });
        }
    </script>
</body>
</html>
