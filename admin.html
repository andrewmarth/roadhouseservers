<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Roadhouse Servers</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <!-- Installable app: manifest, icons, iPhone home-screen settings and the service worker -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Roadhouse">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/site.css">
    <style>
        /* Each Roadhouse account: its name and roles, locked behind Edit */
        .users { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .user { padding: 16px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
        .user.is-editing { border-color: var(--gold); }
        .user-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .user-name { font-family: 'Oswald', sans-serif; font-size: 1.35rem; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px; overflow-wrap: anywhere; }
        .user-also { font-size: 0.88rem; color: var(--muted); }
        .user-roles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .role-tag { padding: 3px 12px; border-radius: 999px; background: var(--gold); color: #111; font-size: 0.82rem; font-weight: 700; }
        .role-none { font-size: 0.88rem; color: var(--muted); }
        .user-edit {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
            padding: 4px 14px 4px 11px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .user-edit svg { width: 15px; height: 15px; }
        @media (hover: hover) { .user-edit:hover { border-color: var(--gold); background: var(--raised); } }
        /* Their name: first and last (required), and the name they go by (optional) */
        .name-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
        .name-field span { display: block; font-size: 0.9rem; font-weight: 700; margin: 0 0 6px 4px; }
        .name-field small { font-weight: 400; color: var(--muted); }
        .name-field input { width: 100%; min-height: 50px; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); font-family: inherit; font-size: 1.05rem; color: var(--text); }
        .name-field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(199, 144, 72, 0.3); }
        .name-field input.is-invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(237, 34, 39, 0.25); }
        /* Add New User (styled like the dashboards' add buttons) */
        .user-add { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; margin-top: 14px; border: 2px dashed var(--line-strong); border-radius: 12px; background: none; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); }
        .user-add svg { width: 17px; height: 17px; }
        @media (hover: hover) { .user-add:hover { border-color: var(--gold); } }
        .new-user { margin-top: 12px; }
        .role-picks { border: none; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
        .role-pick { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-weight: 700; cursor: pointer; }
        .role-pick input { flex: 0 0 auto; width: 22px; height: 22px; accent-color: var(--red); }
        .user-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .user-actions .btn { min-height: 44px; padding: 8px 20px; }
        .user-error { margin-top: 10px; font-size: 0.9rem; font-weight: 700; color: #ff5a5d; }
        .user-error:empty { display: none; }
        .admin-message { color: var(--muted); }
        .admin-message a { color: var(--gold); }
        @media (max-width: 600px) {
            .user-actions { flex-direction: column-reverse; }
            .user-actions .btn { width: 100%; }
        }
    </style>
</head>
<body class="is-checking">
    <div class="page-loader" role="status">
        <span class="loader-badge" aria-hidden="true"><svg class="loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></span>
        <span class="sr-only">Loading</span>
        <span class="page-loader-text" aria-hidden="true">Popping the popcorn...</span>
        <span class="loader-bar" aria-hidden="true"></span>
    </div>
    <script src="/loader.js"></script>

    <header>
        <div class="top-bar">
            <a href="/" aria-label="Home"><img src="/icons/logo-white.png" alt="RoadHouse Cinemas" width="1077" height="439"></a>
            <div class="top-actions">
            <a href="/" class="sign-out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back
            </a>
            <button type="button" class="sign-out" id="sign-out">
                Sign Out
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
            </div>
        </div>
    </header>

    <main>
        <section class="main-card">
            <div class="card-head">
                <div>
                    <span class="card-eyebrow">Roadhouse Admin</span>
                    <h2>Users</h2>
                </div>
            </div>
            <div id="users"></div>
        </section>
    </main>

    <script type="module">
        import { firebaseConfig, isConfigured, API_URL, FIREBASE_SDK } from '/firebase-config.js';

        // A show day runs from 6 AM to 6 AM Arizona time (MST all year); everyone is signed out when a new one starts
        const showDay = (ms = Date.now()) => new Date(ms - 7 * 3600e3 - 6 * 3600e3).toISOString().slice(0, 10);
        // The roles an admin gives here (the account fields) and what they're called
        const ROLES = [['SERVER', 'Server'], ['SERVER LEAD', 'Lead Server'], ['MANAGER', 'Manager']];
        const EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const ERRORS = { not_allowed: 'Only Roadhouse admins can change users.', not_found: 'That account isn’t a Roadhouse account anymore. Refresh the page.', invalid_name: 'Please enter the first and last name.',
            invalid_phone: 'Please enter their 10-digit mobile number.', exists: 'That number already has an account.' };

        const usersEl = document.getElementById('users');
        let currentUser = null;
        let users = [];
        let editing = null;   // the account ID being edited (one at a time)
        let saving = false;

        async function api(payload) {
            return fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ idToken: await currentUser.getIdToken(), ...payload }),
            }).then(r => r.json());
        }

        const NEW = 'new';   // (editing: the Add New User card)
        const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
        const digitsOnly = s => s.replace(/\D/g, '');
        const formatPhone = d => (!d ? '' : d.length < 4 ? '(' + d : d.length < 7 ? '(' + d.slice(0, 3) + ') ' + d.slice(3) : '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6, 10));

        // A user's form: (a new one: their mobile number first) names, then roles
        function formHtml(u, label, isNew) {
            const field = (key, text, value, hint, attrs) => '<label class="name-field"><span>' + text + (hint ? ' <small>' + hint + '</small>' : '') + '</span>'
                + '<input data-name="' + key + '" ' + (attrs || 'type="text" maxlength="50" autocomplete="off"') + ' value="' + escapeHtml(value || '') + '"></label>';
            return '<div class="name-fields">'
                + (isNew ? field('phone', 'Mobile Number', '', 'how they’ll sign in', 'type="tel" inputmode="tel" autocomplete="off" placeholder="(480) 555-0123"') : '')
                + field('first', 'First Name', u.firstName) + field('last', 'Last Name', u.lastName)
                + field('preferred', 'Preferred Name', u.preferred, '(optional)') + '</div>'
                + '<fieldset class="role-picks"><legend class="sr-only">Roles for ' + escapeHtml(label) + '</legend>'
                + ROLES.map(([c, name]) => '<label class="role-pick"><input type="checkbox" value="' + c + '"' + (u.roles[c] ? ' checked' : '') + '>' + name + '</label>').join('')
                + '</fieldset><p class="user-error" role="alert"></p>'
                + '<div class="user-actions"><button type="button" class="btn btn-secondary" data-cancel>Cancel</button>'
                + '<button type="button" class="btn" data-save><span class="btn-spinner" aria-hidden="true"></span>' + (isNew ? 'Add User' : 'Save') + '</button></div>';
        }
        function render() {
            const blank = { firstName: '', lastName: '', preferred: '', roles: { SERVER: true, 'SERVER LEAD': false, MANAGER: false } };
            usersEl.innerHTML = (users.length ? '<ul class="users">' + users.map(u => {
                const label = u.name || 'No name';
                const also = u.preferred && u.preferred !== u.name.split(' ')[0] ? '<span class="user-also">Goes by ' + escapeHtml(u.preferred) + '</span>' : '';
                const has = ROLES.filter(([c]) => u.roles[c]);
                let html = '<li class="user' + (editing === u.id ? ' is-editing' : '') + '" data-id="' + escapeHtml(u.id) + '"><div class="user-top"><div>'
                    + '<div class="user-name">' + escapeHtml(label) + '</div>' + also + '</div>'
                    + (editing === u.id ? '' : '<button type="button" class="user-edit" data-edit aria-label="Edit ' + escapeHtml(label) + '">' + EDIT + 'Edit</button>') + '</div>';
                if (editing === u.id) html += formHtml(u, label, false);
                else html += '<div class="user-roles">' + (has.length ? has.map(([, name]) => '<span class="role-tag">' + name + '</span>').join('') : '<span class="role-none">No roles yet</span>') + '</div>';
                return html + '</li>';
            }).join('') + '</ul>' : '<p class="admin-message">No Roadhouse accounts yet.</p>')
                + (editing === NEW ? '<ul class="users new-user"><li class="user is-editing" data-id="' + NEW + '"><div class="user-top"><div class="user-name">New User</div></div>' + formHtml(blank, 'the new user', true) + '</li></ul>'
                    : '<button type="button" class="user-add" data-add>' + PLUS + 'Add New User</button>');
        }

        // The mobile number as it's typed: (480) 555-0123
        usersEl.addEventListener('input', e => {
            if (!e.target.matches('[data-name="phone"]')) return;
            let d = digitsOnly(e.target.value);
            if (d.length === 11 && d.startsWith('1')) d = d.slice(1);
            e.target.value = formatPhone(d.slice(0, 10));
        });
        usersEl.addEventListener('click', async e => {
            if (e.target.closest('[data-add]') && !saving) {
                editing = NEW;
                render();
                const box = usersEl.querySelector('.new-user');
                box.scrollIntoView({ block: 'start', behavior: 'smooth' });
                box.querySelector('input').focus({ preventScroll: true });
                return;
            }
            const li = e.target.closest('.user');
            if (!li || saving) return;
            if (e.target.closest('[data-edit]')) { editing = li.dataset.id; render(); usersEl.querySelector('.is-editing input').focus(); }
            if (e.target.closest('[data-cancel]')) { editing = null; render(); }
            const save = e.target.closest('[data-save]');
            if (save) {
                const isNew = li.dataset.id === NEW;
                const roles = Object.fromEntries(ROLES.map(([c]) => [c, li.querySelector('input[value="' + c + '"]').checked]));
                const name = key => li.querySelector('[data-name="' + key + '"]').value.trim();
                const missing = (isNew && digitsOnly(name('phone')).length !== 10 ? 'phone' : '') || ['first', 'last'].find(key => !name(key));
                li.querySelectorAll('.is-invalid').forEach(x => x.classList.remove('is-invalid'));
                if (missing) {
                    const box = li.querySelector('[data-name="' + missing + '"]');
                    box.classList.add('is-invalid');
                    box.focus();
                    li.querySelector('.user-error').textContent = missing === 'phone' ? 'Please enter their 10-digit mobile number.' : 'Please enter the ' + missing + ' name.';
                    return;
                }
                saving = true;
                save.disabled = true;
                save.classList.add('is-loading');
                try {
                    const fields = { firstName: name('first'), lastName: name('last'), preferredName: name('preferred'), roles };
                    const json = await api(isNew ? { action: 'addRoadhouseUser', phone: digitsOnly(name('phone')), ...fields }
                        : { action: 'saveRoadhouseRoles', userId: li.dataset.id, ...fields });
                    if (!json.ok) throw json;
                    users = json.users;
                    editing = null;
                    render();
                } catch (err) {
                    console.error(err);
                    li.querySelector('.user-error').textContent = ERRORS[err && err.error] || 'Something went wrong. Please try again.';
                    save.disabled = false;
                    save.classList.remove('is-loading');
                } finally {
                    saving = false;
                }
            }
        });

        if (!isConfigured) {
            location.replace('/login');
        } else {
            const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
            const { getAuth, onAuthStateChanged, signOut } = await import(`${FIREBASE_SDK}/firebase-auth.js`);
            const auth = getAuth(initializeApp(firebaseConfig));

            onAuthStateChanged(auth, async user => {
                if (!user) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
                // Signed in before today's 6 AM: signed out (which comes back here with no user)
                if (showDay(Date.parse(user.metadata.lastSignInTime)) !== showDay()) { signOut(auth); return; }
                currentUser = user;
                try {
                    const json = await api({ action: 'roadhouseUsers' });
                    if (json.ok) { users = json.users; render(); }
                    else if (json.error === 'not_found') { location.replace('/login'); return; }
                    else if (json.error === 'not_allowed') usersEl.innerHTML = '<p class="admin-message">This page is only for Roadhouse admins. <a href="/">Back home</a></p>';
                    else throw json;
                } catch (err) {
                    console.error(err);
                    usersEl.innerHTML = '<p class="admin-message">We couldn’t load the users. Please refresh to try again.</p>';
                }
                document.body.classList.remove('is-checking');
            });

            const signOutBtn = document.getElementById('sign-out');
            signOutBtn.addEventListener('click', async () => {
                signOutBtn.disabled = true;
                await signOut(auth);
            });
        }
    </script>
</body>
</html>
